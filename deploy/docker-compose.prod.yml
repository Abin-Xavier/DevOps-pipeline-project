services:
  api:
    image: ${DOCKERHUB_USERNAME}/taskapi:${IMAGE_TAG}
    container_name: taskapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_USERNAME}/taskfrontend:${IMAGE_TAG}
    container_name: taskfrontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
