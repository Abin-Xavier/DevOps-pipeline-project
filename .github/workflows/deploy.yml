name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (commit SHA) to deploy"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Work out the image tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH (rolls back automatically on failure)
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}' ~/app/deploy.sh '${{ steps.vars.outputs.tag }}'"

      - name: Final check from the outside
        run: |
          sleep 3
          curl -fsS --retry 5 --retry-delay 4 "https://${{ secrets.DEPLOY_HOST }}/health" -k

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
