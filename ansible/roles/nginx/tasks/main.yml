---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Remove the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy the placeholder page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Deploy the site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain_name }}.conf"
    state: link
  notify: Reload nginx

- name: Check the Nginx config before going on
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Make sure Nginx is running and starts on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply pending Nginx changes now
  ansible.builtin.meta: flush_handlers

- name: Get or renew the certificate and set up the HTTPS redirect
  ansible.builtin.command: >
    certbot --nginx
    --non-interactive --agree-tos --redirect
    --email {{ certbot_email }}
    -d {{ domain_name }}
    {{ '--staging' if certbot_staging | bool else '' }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

- name: Make sure the Certbot renewal timer is on
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true
