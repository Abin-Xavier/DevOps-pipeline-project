---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Remove the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Deploy the placeholder page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Check whether a certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_file

- name: Deploy the site config (HTTP only until a certificate exists)
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    cert_exists: "{{ cert_file.stat.exists }}"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ domain_name }}.conf"
    state: link
  notify: Reload nginx

- name: Check the Nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Make sure Nginx is running and starts on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply pending Nginx changes now
  ansible.builtin.meta: flush_handlers

- name: Obtain the certificate (webroot challenge, no Nginx edits)
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/html
    --non-interactive --agree-tos
    --email {{ certbot_email }}
    -d {{ domain_name }}
    {{ '--staging' if certbot_staging | bool else '' }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

- name: Rewrite the site config with HTTPS now that the certificate exists
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    cert_exists: true
  notify: Reload nginx

- name: Apply the HTTPS config
  ansible.builtin.meta: flush_handlers

- name: Make sure the Certbot renewal timer is on
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true
